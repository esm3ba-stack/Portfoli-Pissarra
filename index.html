<style>
/* Palette taken from Pol's black-and-white photo: neutral greys, deep black, and the warm tone of the candle bokeh as the only accent. */
:root{
  /* Chalkboard: slate board, chalk white, three coloured chalks */
  --bg:#1F2624; --ink:#EEECE4; --dark:#161B1A; --paper:#29322F; --line:rgba(238,236,228,.24); --muted:#A7B0AA;
  --acc:#8FC8F2; --acc-l:#F4DD86; --red:#F39DBC; --cream:#EEECE4; --soft:#C6CDC7;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:clamp(16px,5.5vw,80px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;padding:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gut)}
h1,h2,h3,p{margin:0}
.display{font-weight:800;letter-spacing:-.055em;line-height:.94;text-wrap:balance}

/* cursor light */
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:90;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(circle,rgba(222,196,150,.46) 0%,rgba(205,180,140,.20) 34%,rgba(205,180,140,0) 68%);will-change:transform}
#glow::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#111110;box-shadow:0 0 0 2px rgba(238,237,234,.8)}
@media (hover:none){#glow,#dot{display:none}}
#glow::after{display:none}
#dot{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#111110;box-shadow:0 0 0 2px rgba(238,237,234,.8);pointer-events:none;z-index:1000;opacity:0;transition:width .2s ease,height .2s ease,margin .2s ease,background-color .2s ease,opacity .2s ease;will-change:transform}
#dot.hov{width:34px;height:34px;margin:-17px 0 0 -17px;background:rgba(17,17,16,.12);box-shadow:0 0 0 1.5px #111110}
@media (hover:hover) and (pointer:fine){html,body,*{cursor:none!important}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;flex-wrap:wrap}
.brand{font-family:var(--f-mono);font-weight:700;letter-spacing:.16em;font-size:20px}
.nav-r{display:flex;align-items:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap}
.nav-r .lk{font-weight:500;font-size:17px}
.nav-r .lk:hover,.nav-r .lk[aria-current="page"]{color:var(--pf,var(--acc))}
.nav-r .lk[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.lang{display:flex;gap:4px}
.lang a{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:6px 10px;border-radius:4px}
.lang a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.lang a:not([aria-current="true"]):hover{background:var(--paper)}

/* landing hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:clamp(32px,6vw,80px);align-items:center;padding-block:clamp(40px,7vw,80px)}
.hero h1{font-size:clamp(40px,6.4vw,84px)}
.hero p{font-size:clamp(17px,1.7vw,22px);line-height:1.45;max-width:34em;margin-top:32px}
.link{display:inline-flex;gap:12px;align-items:center;font-weight:700;font-size:17px;padding-bottom:6px;border-bottom:1.5px solid currentColor;margin-top:32px}
.photo{margin:0;position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--dark);border-radius:28px}
@media (max-width:860px){.photo{border-radius:22px}}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:contrast(1.04)}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:18px 20px;color:var(--cream);background:linear-gradient(transparent,rgba(14,14,13,.7))}
.hero .links{display:flex;gap:28px;flex-wrap:wrap}
.hero h1 .sub{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;font-size:.46em;line-height:1.1;color:var(--acc);margin-top:.45em}
.hero{min-height:calc(100vh - 80px)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.photo{max-width:480px}}

/* projects grid */
.projects{padding-block:clamp(40px,6vw,72px) clamp(64px,9vw,110px)}
.projects h2{font-size:clamp(40px,6.4vw,84px);margin-bottom:40px}
.feat{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);background:var(--red);color:var(--cream);border:2px solid var(--ink);margin-bottom:24px;min-height:600px}
.feat .t{padding:clamp(24px,3.4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.feat .meta{display:flex;justify-content:space-between;gap:16px}
.feat h3{font-size:clamp(56px,8.4vw,112px)}
.feat .h{font-weight:800;font-size:clamp(26px,3vw,38px);letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.feat .d{font-size:17px;line-height:1.45;margin-top:18px;max-width:34em}
.feat .im{background-size:cover;background-position:center;min-height:280px;transition:transform .6s ease}
.feat .imw{overflow:hidden;position:relative}
.feat:hover .im{transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--dark);color:var(--cream);min-height:660px}
.card.lt{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px #C4C0B6}
.card .imw{aspect-ratio:628/320;overflow:hidden;background:#222}
.card .im{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover .im{transform:scale(1.05)}
.card .bar{height:6px}
.card .b{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px 32px 28px}
.card h3{font-size:clamp(30px,3.4vw,44px);font-weight:800;letter-spacing:-.045em;line-height:.96;margin:14px 0}
.card p{font-size:17px;line-height:1.45}
.card .meta{display:flex;justify-content:space-between;gap:12px}
.card .link{align-self:flex-start;margin-top:0}
@media (max-width:860px){.feat{grid-template-columns:minmax(0,1fr)}.feat .imw{order:-1;min-height:260px}.grid{grid-template-columns:minmax(0,1fr)}.card{min-height:0}}

/* about */
.about{background:#10100E;color:var(--cream)}
.about .wrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:clamp(72px,10vw,120px)}
.about h2{font-size:clamp(36px,5.6vw,80px)}
.about h2 em{font-family:var(--f-serif);font-style:italic;font-weight:400;color:var(--acc-l);letter-spacing:-.02em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,5vw,80px);margin-top:72px;padding-top:32px;border-top:1px solid #3A3A38;color:var(--soft);font-size:clamp(16px,1.5vw,20px);line-height:1.5}
@media (max-width:860px){.about .wrap{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr);margin-top:40px}}

/* contact */
.contact{padding-block:clamp(64px,9vw,100px) 36px}
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:56px}
.ch h2{font-size:clamp(44px,8vw,104px);text-align:right;margin-left:auto}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:16px;align-items:center;padding-block:32px;border-top:1px solid var(--line)}
.row b{font-weight:800;font-size:clamp(34px,4.6vw,56px);letter-spacing:-.045em;line-height:1}
.row span{color:var(--muted);font-size:18px;overflow-wrap:anywhere}
.row .ar{font-size:36px;text-align:right}
a.row:hover b{color:var(--acc)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) 32px}.row span{grid-column:1;grid-row:2}.row .ar{grid-row:1;grid-column:2}.ch h2{text-align:left;margin-left:0}}

/* project page */
.ph{position:relative;background:#0E0E10;color:var(--cream);overflow:hidden;isolation:isolate}
.ph .bg,.ph .bg2{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.ph .bg{filter:brightness(.34) saturate(.9)}
.ph .bg2{z-index:-1;-webkit-mask-image:radial-gradient(circle 260px at var(--mx,-999px) var(--my,-999px),#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:radial-gradient(circle 260px at var(--mx,-999px) var(--my,-999px),#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);filter:brightness(.95) saturate(1.05)}
.ph .wrap{padding-block:clamp(40px,6vw,72px) clamp(56px,9vw,120px);display:flex;flex-direction:column;gap:clamp(36px,6vw,80px)}
.back{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;color:var(--cream)}
.back:hover{color:var(--acc-l)}
.ph h1{font-size:clamp(48px,11vw,160px);line-height:.9;overflow-wrap:anywhere}
.ph .tag{color:var(--acc-l);margin-bottom:20px;display:block}
.ph .hd{font-weight:800;font-size:clamp(24px,3.2vw,44px);letter-spacing:-.04em;line-height:1.02;max-width:20em;margin-top:28px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;padding-block:32px;border-bottom:1px solid var(--line)}
.facts div{display:flex;flex-direction:column;gap:8px}
.facts .mono{color:var(--muted)}
.facts b{font-weight:700;font-size:19px;line-height:1.25}
.body{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:clamp(48px,7vw,96px)}
.sec{max-width:46em;margin-bottom:56px}
.sec .mono{color:var(--acc);display:block;margin-bottom:14px}
.sec p{font-size:clamp(19px,2vw,26px);line-height:1.42;letter-spacing:-.01em}
.items{max-width:46em;border-top:1px solid var(--line)}
.items li{list-style:none;padding:18px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.items{margin:0;padding:0}
.items li::before{content:"↗";color:var(--acc);font-weight:700}
@media (max-width:860px){.body{grid-template-columns:minmax(0,1fr);gap:24px}}
.gal{padding-bottom:clamp(56px,8vw,100px)}
.gal .mono{color:var(--muted);display:block;margin-bottom:20px}
.cols{columns:3 300px;column-gap:16px}
.cols figure{margin:0 0 16px;break-inside:avoid;background:var(--paper);overflow:hidden}
.cols img{width:100%;height:auto;transition:transform .6s ease}
.cols figure:hover img{transform:scale(1.03)}
.next{background:var(--dark);color:var(--cream);position:relative;overflow:hidden}
.next .wrap{padding-block:clamp(56px,8vw,100px);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.next .mono{color:var(--soft);display:block;margin-bottom:16px}
.next a.big{font-weight:800;font-size:clamp(40px,7vw,96px);letter-spacing:-.05em;line-height:.95;display:block}
.next a.big:hover{color:var(--acc-l)}
.next .all{font-weight:700;border-bottom:1.5px solid currentColor;padding-bottom:6px}
.pfoot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px}

/* stacked project cards */
.stack{display:flex;flex-direction:column;gap:56px;padding-bottom:40px}
.sc{position:sticky;top:calc(84px + var(--i)*26px);height:clamp(460px,72vh,620px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);border-radius:28px;overflow:hidden;color:var(--ink);border:1px solid rgba(17,17,16,.12);box-shadow:0 24px 60px -24px rgba(17,17,16,.45);transform-origin:50% 0;transform:scale(calc(1 - var(--p,0)*.05));will-change:transform}
.sc.dk{color:var(--cream);border-color:rgba(255,255,255,.08)}
.sc .t{padding:clamp(24px,3.4vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0;opacity:calc(1 - var(--p,0)*.55)}
.sc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sc .num{font-size:clamp(72px,10vw,150px);line-height:.8}
.sc .tg{text-align:right;padding-top:8px;opacity:.8}
.sc h3{font-size:clamp(34px,4.6vw,68px);margin-bottom:14px}
.sc .h{font-weight:700;font-size:clamp(18px,1.8vw,24px);letter-spacing:-.03em;line-height:1.15}
.sc .d{font-size:16px;line-height:1.45;margin-top:12px;max-width:34em;opacity:.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc .link{margin-top:20px;display:inline-flex}
.sc .imw{position:relative;overflow:hidden;background:#222;min-height:0}
.sc .im{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.sc:hover .im{transform:scale(1.05)}
.sc .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
@media (max-width:860px){.sc{grid-template-columns:minmax(0,1fr);grid-template-rows:38% minmax(0,1fr);height:clamp(540px,80vh,680px);top:calc(76px + var(--i)*14px);border-radius:22px}.sc .imw{order:-1}.sc .bar{top:auto;right:0;width:auto;height:6px}.sc .num{font-size:64px}}


/* inner page header */
.phd{padding-block:clamp(40px,6vw,80px) clamp(28px,4vw,48px)}
.phd .mono{color:var(--acc);display:block;margin-bottom:18px}
.phd h1{font-size:clamp(44px,8vw,112px)}
.phd p{font-size:clamp(17px,1.6vw,21px);line-height:1.45;max-width:36em;margin-top:24px;color:var(--muted)}
.about{margin-top:0}
.cv{padding-block:clamp(56px,8vw,100px)}
.cvb{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding-block:36px;border-top:1px solid var(--line)}
.cvb > .mono{color:var(--acc)}
.cvr{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) minmax(0,1fr);gap:8px 24px;padding-block:16px;border-bottom:1px solid var(--line);align-items:baseline}
.cvr:first-child{padding-top:0}
.cvr .y{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cvr b{font-weight:700;font-size:19px;letter-spacing:-.02em}
.cvr span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:500}
@media (max-width:860px){.cvb{grid-template-columns:minmax(0,1fr);gap:20px}.cvr{grid-template-columns:minmax(0,1fr)}}

/* 3D keychain */
.k3{background:radial-gradient(120% 90% at 50% 40%,#F7F6F3 0%,var(--paper) 70%);border-radius:28px;margin-block:clamp(24px,4vw,48px) 0;position:relative;overflow:hidden}
.k3 .bar3{position:absolute;left:clamp(20px,3vw,36px);right:clamp(20px,3vw,36px);top:clamp(18px,2.6vw,30px);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2;flex-wrap:wrap}
.k3 .bar3 .mono{color:var(--acc)}
.k3 button{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:9px 16px;background:transparent;color:var(--ink)}
.k3 button:hover{background:var(--ink);color:var(--bg)}
.k3c{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zm{display:flex;align-items:center;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.k3 .zm button{border:0;border-radius:0;width:44px;height:36px;padding:0;font-size:18px;font-family:var(--f-body);line-height:1}
.zm span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.k3 .hint{padding-inline:16px}
.k3 .hint{position:absolute;left:0;right:0;bottom:clamp(16px,2.4vw,28px);text-align:center;color:var(--muted);z-index:2}
.k3stage{height:clamp(480px,78vh,720px);display:grid;place-items:center;perspective:1500px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.k3stage.drag{cursor:grabbing}
.k3obj{--h:min(500px,56vh,108vw);height:var(--h);width:calc(var(--h)*.7656);position:relative;transform-style:preserve-3d;will-change:transform}
.k3obj > *{position:absolute;inset:0;width:100%;height:100%}
.k3obj img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.k3f,.k3b{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.k3e{backface-visibility:visible}
.k3gl{position:absolute;inset:0;mix-blend-mode:soft-light;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 65%);background-size:320% 100%;background-position:var(--shx,50%) 0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.k3ring{position:absolute;inset:auto;width:30%;height:auto;aspect-ratio:1;transform-style:preserve-3d;pointer-events:none}
.k3ring svg{width:100%;height:100%;display:block;backface-visibility:visible}
.k3sh{position:absolute;left:50%;bottom:9%;width:min(320px,60vw);height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(14,14,13,.28),rgba(14,14,13,0));transform:translateX(-50%) scaleX(var(--shs,1));pointer-events:none}
@media (max-width:860px){.k3{border-radius:22px}}

/* before / after */
.ba{margin-block:clamp(32px,5vw,64px) 0;display:flex;flex-direction:column;gap:16px}
.ba .bal{color:var(--acc)}
.ba figure{margin:0;position:relative;overflow:hidden;border-radius:28px;background:var(--paper)}
.ba img{width:100%;height:100%;object-fit:cover;display:block}
.bab{aspect-ratio:1284/1067;max-height:78vh}
.bab img{filter:saturate(.92)}
.ba .tagb,.ba .taga{position:absolute;left:18px;top:18px;background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px}
.ba .taga{background:var(--ink);color:var(--bg)}
.baarrow{text-align:center;font-size:22px;color:var(--muted)}
.baa{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.baa figure{aspect-ratio:4/5}
@media (max-width:860px){.ba figure{border-radius:22px}.baa{grid-template-columns:minmax(0,1fr);}.baa figure{aspect-ratio:4/5}}

/* landing call to action */
.cta{padding-block:clamp(48px,8vw,96px) 36px}
.ctal{display:flex;flex-direction:column;gap:18px;padding-block:clamp(32px,5vw,56px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctal .mono{color:var(--acc)}
.ctal h2{font-size:clamp(52px,10vw,148px);display:flex;align-items:baseline;gap:.2em;flex-wrap:wrap}
.ctal .ar{font-size:.6em;transition:transform .3s ease}
.ctal:hover h2{color:var(--acc)}
.ctal:hover .ar{transform:translate(8px,-8px)}
/* contact page */
.cform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:clamp(32px,6vw,80px);padding-bottom:clamp(64px,9vw,110px);align-items:start}
.cform form,.cdone{display:flex;flex-direction:column;gap:22px;min-width:0}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fld{display:flex;flex-direction:column;gap:10px;min-width:0}
.fld .mono{color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:10px 2px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 8px) 55%;background-size:6px 6px;background-repeat:no-repeat;cursor:pointer}
.fld textarea{resize:vertical;min-height:150px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--acc);box-shadow:0 1.5px 0 var(--acc)}
.fld .bad{border-bottom-color:#B3261E;box-shadow:0 1.5px 0 #B3261E}
.fact{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;gap:10px;align-items:center;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);border-radius:999px;padding:16px 26px;min-height:44px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.ferr{color:#B3261E}
.cdone h2{font-size:clamp(32px,4.4vw,56px)}
.cdone p{color:var(--muted);font-size:18px;line-height:1.5;max-width:40em}
.cdone pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:14px;line-height:1.6;background:var(--paper);border-radius:18px;padding:22px;margin:0;overflow-wrap:anywhere}
.cside{display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:28px;background:var(--dark);color:var(--cream)}
.cside .mono{color:var(--soft)}
.cside b{font-size:18px;font-weight:700;overflow-wrap:anywhere;user-select:all}
@media (max-width:860px){.cform{grid-template-columns:minmax(0,1fr)}.frow{grid-template-columns:minmax(0,1fr)}.cside{border-radius:22px}}

/* next-page teaser + transition */
.tz{background:var(--dark);color:var(--cream);position:relative}
.tzin{min-height:40vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:clamp(48px,7vw,88px)}
.tzl{color:var(--soft)}
.tzt{font-size:clamp(40px,7vw,104px);display:flex;align-items:baseline;gap:.2em;flex-wrap:wrap;transition:color .3s,transform .35s cubic-bezier(.2,.7,.2,1);transform:translateY(calc(var(--tzp,0)*-10px))}
.tzt .ar{font-size:.42em;display:inline-block;opacity:calc(.45 + var(--tzp,0)*.55)}
.tzin:hover .tzt{color:var(--acc-l)}
.tzbar{display:block;height:1px;background:rgba(238,237,234,.14);overflow:hidden;max-width:360px}
.tzbar i{display:block;height:100%;width:calc(var(--tzp,0)*100%);background:var(--acc-l)}
.tzh{color:var(--soft);opacity:.7}
.tzf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px;border-top:1px solid rgba(238,237,234,.12);color:var(--soft)}
.tzf a:hover{color:var(--acc-l)}
.nextpg{position:relative}
.nplab{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px;border-top:1px solid var(--line);color:var(--muted)}
.nplab span:first-child{color:var(--acc)}
.endfoot span:first-child{color:var(--ink);font-weight:700}
.nphead{pointer-events:none;min-height:100vh}
main.pg-in{animation:pgin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* page color follows the active project */
body,.nav{background:var(--pg,var(--bg));transition:background-color .7s ease,color .7s ease,border-color .7s ease}
.nav,.projects h2{color:var(--pf,var(--ink))}
.nav{border-bottom-color:var(--pl,var(--line))}
.lang a[aria-current="true"]{background:var(--pf,var(--ink));color:var(--pg,var(--bg))}

/* ================= Chalkboard theme ================= */
body{font-size:19px;line-height:1.38;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 1px rgba(238,236,228,.18)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(img/dust.webp) repeat;background-size:640px 640px;opacity:.95}
#app{position:relative;z-index:1}
.mono{font-family:var(--f-mono);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:17px}
.display{font-weight:400;letter-spacing:0;line-height:.98}
h1,h2,h3,.display,.brand,.node,.bct{-webkit-mask-image:var(--grain);mask-image:var(--grain);-webkit-mask-size:300px 300px;mask-size:300px 300px}
::selection{background:var(--acc-l);color:#1F2624}
:focus-visible{outline:2px dashed var(--acc-l);outline-offset:4px}

/* chalk cursor */
#dot{background:var(--ink);box-shadow:0 0 6px rgba(238,236,228,.6)}
#dot.hov{background:rgba(238,236,228,.08);box-shadow:0 0 0 2px var(--ink)}
#glow{background:radial-gradient(circle,rgba(238,236,228,.10) 0%,rgba(238,236,228,.04) 40%,rgba(238,236,228,0) 70%)}
#glow::after{display:none}

/* nav */
.nav{background:var(--pg,var(--bg));border-bottom:2px dashed var(--pl,var(--line))}
.brand{font-family:var(--f-mono);font-weight:400;letter-spacing:.08em;font-size:26px}
.nav-r .lk{font-size:21px}
.lang a{font-size:16px;border-radius:12px 10px 13px 9px}
.lang a[aria-current="true"]{background:var(--ink);color:#1F2624}
.lang a:not([aria-current="true"]):hover{background:rgba(238,236,228,.12)}

/* buttons, links, fields */
.link{font-weight:400;font-size:21px;border-bottom:2px solid currentColor}
.btn{font-weight:400;font-size:22px;background:var(--ink);color:#1F2624;border-radius:18px 14px 20px 12px/12px 20px 14px 18px}
.btn:hover{background:var(--acc-l)}
.btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#1F2624}
.fld input,.fld select,.fld textarea{font-size:22px;color:var(--ink);border-bottom:2px dashed rgba(238,236,228,.6)}
.fld input::placeholder,.fld textarea::placeholder{color:rgba(238,236,228,.4)}
.fld input:focus,.fld textarea:focus{border-bottom:2px solid var(--acc-l);box-shadow:none}
.fld .bad{border-bottom-color:var(--red)!important;box-shadow:none}
.ferr{color:var(--red)}
.hpf{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ---------- hero: two chalk maps + portrait ---------- */
.hero{min-height:calc(100vh - 78px);padding-block:clamp(28px,4vw,56px);grid-template-columns:minmax(0,1fr) minmax(0,540px);align-items:center;gap:clamp(28px,5vw,72px)}
.maps{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.map{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink)}
.hero .node,.node{display:inline-block;width:auto;max-width:100%;font-weight:400;font-size:clamp(30px,3.2vw,48px);line-height:1;margin:0;padding:.18em .7em .22em;border:3px solid currentColor;border-radius:26px 34px 22px 30px/30px 22px 34px 26px;letter-spacing:.01em}
.m2 .node{color:var(--acc);border-width:3px;outline:2px solid currentColor;outline-offset:6px;border-radius:6px 9px 5px 8px;transform:rotate(-1deg)}
.br{width:92%;height:auto;display:block;margin-top:2px;color:var(--ink)}
.m2 .br{color:var(--acc)}
.leaves{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,18px)}
.leaves li{position:relative;font-size:clamp(17px,1.5vw,22px);line-height:1.08;padding:.4em .4em .45em;border:2px solid rgba(238,236,228,.75);border-radius:16px 22px 14px 20px/20px 14px 22px 16px;display:flex;align-items:center;justify-content:center;min-height:2.9em}
.m1 .leaves li{color:var(--soft)}
.m1 .leaves li::after{content:"";position:absolute;left:-5%;right:-5%;top:48%;height:3.5px;border-radius:3px;background:var(--red);transform:rotate(-7deg);-webkit-mask-image:var(--grain);mask-image:var(--grain);-webkit-mask-size:120px;mask-size:120px}
.m1 .leaves li:nth-child(2)::after{transform:rotate(5deg)}
.m1 .leaves li:nth-child(3)::after{transform:rotate(-4deg)}
.m2 .leaves li{padding:0;border-color:var(--acc)}
.m2 .leaves a{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:.45em .4em .5em;color:var(--acc);transition:background .2s,color .2s}
.m2 .leaves a:hover{background:var(--acc);color:#1F2624}
.hero .verdict,.verdict{margin-top:12px;font-size:clamp(20px,2vw,28px);line-height:1.15;color:var(--ink)}
.verdict em{font-style:normal;color:var(--acc-l);text-decoration:underline wavy rgba(244,221,134,.7);text-decoration-thickness:2px;text-underline-offset:6px}
.hop{width:52px;height:auto;color:var(--acc-l);margin:0 0 2px 90px}

/* square portrait with the rotating name */
.sqp{margin:0;position:relative;aspect-ratio:1/1;width:100%;max-width:560px;justify-self:end;overflow:hidden;background:#121716;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(238,236,228,.14),0 30px 60px -30px rgba(0,0,0,.7)}
.sqp::before{content:"";position:absolute;inset:0;background:url(img/dust.webp) repeat;background-size:520px;opacity:.55;pointer-events:none}
.sqtag{position:absolute;right:22px;top:18px;z-index:3;font-size:16px;color:var(--ink);letter-spacing:.14em}
.ring{position:absolute;left:50%;top:34.6%;width:64%;height:auto;aspect-ratio:1;margin:-32% 0 0 -32%;z-index:1;color:var(--ink);fill:currentColor;overflow:visible;animation:noria 28s linear infinite}
.ring text{font-family:var(--f-body);font-size:15.5px;letter-spacing:2px;text-transform:uppercase}
@keyframes noria{to{transform:rotate(360deg)}}
.me{position:absolute;left:10%;bottom:0;width:80%;height:auto;z-index:2;filter:grayscale(1) contrast(1.05)}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.sqp{justify-self:center}.hop{margin-left:0}}
@media (max-width:520px){.leaves li{font-size:16px;min-height:3.4em;padding:.4em .25em}.node{font-size:34px}}

/* ---------- inner headers, projects ---------- */
.phd .mono{color:var(--acc-l)}
.phd h1{font-size:clamp(46px,8vw,118px)}
.phd p{color:var(--soft);font-size:clamp(20px,1.9vw,25px)}
.projects h2{font-size:clamp(46px,7vw,100px)}
.sc{border:2px solid rgba(238,236,228,.42)!important;border-radius:30px 22px 34px 20px/22px 34px 20px 30px;box-shadow:0 24px 60px -24px rgba(0,0,0,.65)}
.sc .num{color:var(--acc-l)}
.sc h3{font-size:clamp(40px,5vw,74px)}
.sc .h{font-weight:400;font-size:clamp(21px,2vw,28px);letter-spacing:0}
.sc .d{font-size:19px;line-height:1.32;opacity:.85}
.sc .imw{border-left:2px dashed rgba(238,236,228,.3)}
.sc .tg{font-size:16px}
@media (max-width:860px){.sc .imw{border-left:0;border-bottom:2px dashed rgba(238,236,228,.3)}}

/* project pages */
.ph{background:#121716}
.ph .tag{color:var(--acc-l)}
.ph .hd{font-weight:400;letter-spacing:0}
.facts b{font-weight:400;font-size:22px}
.facts .mono,.gal .mono{color:var(--muted)}
.sec .mono{color:var(--acc-l)}
.sec p{font-size:clamp(21px,2.1vw,28px);line-height:1.3;letter-spacing:0}
.items li{font-size:21px}
.items li::before{color:var(--acc-l)}
.facts{border-bottom:2px dashed var(--line)}.items{border-top:2px dashed var(--line)}.items li{border-bottom:2px dashed var(--line)}
.cvb{border-top:2px dashed var(--line)}.cvr{border-bottom:2px dashed var(--line)}.ctal{border-top:2px dashed var(--line);border-bottom:2px dashed var(--line)}
.nplab,.foot{border-top:2px dashed var(--line)}
.k3{background:radial-gradient(120% 90% at 50% 40%,#2C3633 0%,#1A201F 70%)}
.k3 button{color:var(--ink);border-color:var(--ink);font-size:15px}
.k3 button:hover{background:var(--ink);color:#1F2624}
.zm{border-color:var(--ink)}
.k3sh{background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))}
.ba .tagb{background:var(--ink);color:#1F2624}.ba .taga{background:var(--acc-l);color:#1F2624}
.cols figure{background:#121716}

/* ---------- about ---------- */
.about{background:transparent;color:var(--ink)}
.about .mono{color:var(--acc-l)}
.abh{font-size:clamp(48px,7.4vw,108px)}

        [["LA IDEA","LA IDEA","THE IDEA"],["Una app y un espacio físico bajo un lema: «On el futbol es viu fora del camp». Cuatro valores como base: orgullo, pasión, identidad y familia. La tienda deja de vender solo camisetas y se convierte en un lugar donde hacer comunidad.","Una app i un espai físic sota un lema: «On el futbol es viu fora del camp». Quatre valors com a base: orgull, passió, identitat i família. La botiga deixa de vendre només samarretes i es converteix en un lloc on fer comunitat.","An app and a physical space under one line: “On el futbol es viu fora del camp” (where football is lived off the pitch). Four values as the base: pride, passion, identity and family. The store stops selling only shirts and becomes a place to build community."]]],
  res:[["EL RESULTADO","EL RESULTAT","THE RESULT"],["No ganamos entre los seis equipos, pero presentamos la propuesta al departamento de marketing del Girona FC y el club puso en marcha la retransmisión de los partidos fuera de casa en la pantalla de la segunda planta.","No vam guanyar entre els sis equips, però vam presentar la proposta al departament de màrqueting del Girona FC i el club va posar en marxa la retransmissió dels partits fora de casa a la pantalla de la segona planta.","We didn't win among the six teams, but we presented the proposal to Girona FC's marketing department, and the club started screening away matches on the second-floor screen."]],
  listH:["QUÉ INCLUYE","QUÈ INCLOU","WHAT IT INCLUDES"],
  items:[["Run Club: salida y llegada en la tienda, los jueves a las 17 h. 5 € (3 € para socios).","Run Club: sortida i arribada a la botiga, els dijous a les 17 h. 5 € (3 € per als socis).","Run Club: starts and ends at the store, Thursdays at 5 pm. €5 (€3 for members)."],
         ["«Ara tu ets l'àrbitre», firmas y juegos dentro de un calendario mensual de actividades.","«Ara tu ets l'àrbitre», firmes i jocs dins d'un calendari mensual d'activitats.","“Ara tu ets l'àrbitre”, signings and games inside a monthly activity calendar."],
         ["Día de partido: previa en directo del podcast Tribunerus, partido en la tienda y plazas limitadas.","Dia de partit: prèvia en directe del podcast Tribunerus, partit a la botiga i places limitades.","Matchday: live preview from the Tribunerus podcast, the match shown in the store, limited places."],
         ["Juegos interactivos en la calle con descuentos y sorteos de merchandising.","Jocs interactius al carrer amb descomptes i sortejos de merxandatge.","Interactive street games with discounts, plus merchandise giveaways."],
         ["En la app: votación del jugador preferido y la porra del partido.","A l'app: votació del jugador preferit i la porra del partit.","In the app: vote for your favorite player and the match prediction game."]]
},
{ slug:"romo-matcha-motion", n:"02", color:"#7FB414", card:"romo_card", hero:"romo_card",
  gal:[], ba:{before:"romo_before", after:["can1","can2","can3"]},
  tag:["PACKAGING · REDES SOCIALES","PACKAGING · XARXES SOCIALS","PACKAGING · SOCIAL MEDIA"],
  title:"Romo Matcha Motion",
  head:["Tres sabores, tres mundos de color.","Tres sabors, tres móns de color.","Three flavors, three color worlds."],
  short:["Rediseño de las latas de una bebida con matcha y café: de una lata azul marino igual para los tres sabores a una lata con color propio para cada uno, presentada en piezas para redes.","Redisseny de les llaunes d'una beguda amb matcha i cafè: d'una llauna blau marí igual per als tres sabors a una llauna amb color propi per a cadascun, presentada en peces per a xarxes.","A redesign of the cans for a matcha and coffee drink: from one navy can for all three flavors to a can with its own color for each, presented in social media pieces."],
  meta:[[["TIPO","TIPUS","TYPE"],["Rediseño de packaging y piezas para redes","Redisseny de packaging i peces per a xarxes","Packaging redesign and social pieces"]],
        [["PRODUCTO","PRODUCTE","PRODUCT"],["Bebida con matcha y café · lata de 33 cl","Beguda amb matcha i cafè · llauna de 33 cl","Matcha and coffee drink · 33 cl can"]],
        [["FORMATO","FORMAT","FORMAT"],["3 latas · piezas verticales 4:5","3 llaunes · peces verticals 4:5","3 cans · vertical 4:5 pieces"]]],
  secs:[[["ANTES","ABANS","BEFORE"],["Las latas originales eran azul marino para todos los sabores. Lo único que los diferenciaba era una pequeña ilustración de la fruta y el nombre del sabor, así que en el lineal costaba distinguirlas.","Les llaunes originals eren blau marí per a tots els sabors. L'únic que els diferenciava era una petita il·lustració de la fruita i el nom del sabor, així que al lineal costava distingir-les.","The original cans were navy blue for every flavor. The only difference was a small fruit illustration and the flavor name, so they were hard to tell apart on the shelf."]],
        [["EL REDISEÑO","EL REDISSENY","THE REDESIGN"],["Cada sabor tiene ahora su propio color, de la lata al fondo: lima-limón en verdes y amarillos, frutos rojos en granate y mango-maracuyá en tonos melocotón y lila. El logotipo ROMO sigue en vertical, para que la marca se reconozca igual que antes.","Cada sabor té ara el seu propi color, de la llauna al fons: llima-llimona en verds i grocs, fruits vermells en grana i mango-maracuià en tons préssec i lila. El logotip ROMO continua en vertical, perquè la marca es reconegui igual que abans.","Each flavor now has its own color, from the can to the background: lime-lemon in greens and yellows, red berries in deep red, and mango-passion fruit in peach and lilac. The ROMO logo stays vertical, so the brand is as recognizable as before."]],
        [["LAS PIEZAS","LES PECES","THE PIECES"],["Las tres piezas comparten composición: la lata en diagonal, los ingredientes alrededor y el matcha con el café como hilo común. El logotipo ROMO Matcha Motion cierra cada pieza abajo, centrado.","Les tres peces comparteixen composició: la llauna en diagonal, els ingredients al voltant i el matcha amb el cafè com a fil comú. El logotip ROMO Matcha Motion tanca cada peça a baix, centrat.","All three pieces share one composition: the can on a diagonal, the ingredients around it, and matcha and coffee as the common thread. The ROMO Matcha Motion logo closes each piece at the bottom, centered."]]],
  listH:["LOS TRES SABORES","ELS TRES SABORS","THE THREE FLAVORS"],
  items:[["Lima-limón · verde lima","Llima-llimona · verd llima","Lime-lemon · lime green"],
         ["Frutos rojos · granate","Fruits vermells · grana","Red berries · deep red"],
         ["Mango-maracuyá · naranja","Mango-maracuià · taronja","Mango-passion fruit · orange"]]
},
{ slug:"devant", n:"03", color:"#0B4DA8", card:"devant_cover", hero:"devant_cover",
  gal:["devant_logo"],
  tag:["IDENTIDAD VISUAL · PLAN DE EMPRESA","IDENTITAT VISUAL · PLA D'EMPRESA","VISUAL IDENTITY · BUSINESS PLAN"],
  title:"ANdevant",
  head:["Una A que siempre avanza.","Una A que sempre avança.","An A that keeps moving forward."],
  short:["Logo de ANdevant, la agencia de marketing de nuestro plan de empresa de primero del ciclo: asesoramiento de comunicación e imagen para deportistas de las mejores canteras de España.","Logotip d'ANdevant, l'agència de màrqueting del nostre pla d'empresa de primer del cicle: assessorament de comunicació i imatge per a esportistes dels millors planters d'Espanya.","Logo for ANdevant, the marketing agency from our first-year business plan: communication and image advice for athletes from Spain's best youth academies."],
  meta:[[["TIPO","TIPUS","TYPE"],["Logotipo · plan de empresa","Logotip · pla d'empresa","Logo · business plan"]],
        [["CONTEXTO","CONTEXT","CONTEXT"],["1.º del CFGS de Marketing y Publicidad","1r del CFGS de Màrqueting i Publicitat","1st year, Marketing and Advertising program"]],
        [["MI PAPEL","EL MEU PAPER","MY ROLE"],["El logo, entre otras tareas del plan","El logotip, entre altres tasques del pla","The logo, among other tasks in the plan"]]],
  secs:[[["EL PROYECTO","EL PROJECTE","THE PROJECT"],["En primero del ciclo nos tocó hacer un plan de empresa. El nuestro era ANdevant, una agencia de marketing con una propuesta de valor concreta: ser el asesor de comunicación e imagen de deportistas de las mejores canteras de España. Entre otras tareas del plan, yo me encargué de diseñar el logo.","A primer del cicle ens va tocar fer un pla d'empresa. El nostre era ANdevant, una agència de màrqueting amb una proposta de valor concreta: ser l'assessor de comunicació i imatge d'esportistes dels millors planters d'Espanya. Entre altres tasques del pla, jo em vaig encarregar de dissenyar el logotip.","In the first year of the program we had to write a business plan. Ours was ANdevant, a marketing agency with a clear value proposition: to be the communication and image advisor for athletes from Spain's best youth academies. Among other tasks in the plan, I designed the logo."]],
        [["EL LOGOTIPO","EL LOGOTIP","THE LOGO"],["Una A en azul oscuro atravesada por una flecha en azul claro que se repite hacia la derecha: movimiento y dirección sin necesitar más elementos. El símbolo va arriba y el nombre debajo, en minúsculas y con una tipografía redondeada y legible, en la misma gama de azules.","Una A en blau fosc travessada per una fletxa en blau clar que es repeteix cap a la dreta: moviment i direcció sense necessitar més elements. El símbol va a dalt i el nom a sota, en minúscules i amb una tipografia arrodonida i llegible, en la mateixa gamma de blaus.","A dark blue A crossed by a light blue arrow that repeats toward the right: movement and direction without anything else. The symbol sits on top and the name below in lowercase, in a rounded, readable typeface in the same range of blues."]]],
  listH:["", "", ""], items:[]
},
{ slug:"barberia-macchia", n:"04", color:"#8FA3BE", card:"macchia_cover", hero:"macchia_cover",
  gal:["mac_front","mac_back"],
  tag:["ERASMUS+ · DISEÑO","ERASMUS+ · DISSENY","ERASMUS+ · DESIGN"],
  title:"Barberia Macchia",
  head:["Un abono para el corte de cada semana.","Un abonament per al tall de cada setmana.","A membership for every week's cut."],
  short:["Tarjeta de socio «Fade Club»: 3 retoques de degradado y 1 corte completo al mes por 57 €, con reglamento y diseño por las dos caras.","Targeta de soci «Fade Club»: 3 retocs de degradat i 1 tall complet al mes per 57 €, amb reglament i disseny per les dues cares.","“Fade Club” membership card: 3 fade touch-ups and 1 full haircut a month for €57, with rules and design on both sides."],
  meta:[[["TIPO","TIPUS","TYPE"],["Tarjeta de socio · diseño gráfico","Targeta de soci · disseny gràfic","Membership card · graphic design"]],
        [["CONTEXTO","CONTEXT","CONTEXT"],["Erasmus+ · TAM Comunicazione","Erasmus+ · TAM Comunicazione","Erasmus+ · TAM Comunicazione"]],
        [["IDIOMA","IDIOMA","LANGUAGE"],["Italiano","Italià","Italian"]]],
  secs:[[["LA OFERTA","L'OFERTA","THE OFFER"],["Barberia Macchia, abierta desde 1953, ofrece el «Fade Club»: 57 € al mes por 3 retoques de degradado, uno por semana, y 1 corte completo. Cada retoque es un servicio rápido de 10 a 15 minutos.","Barberia Macchia, oberta des de 1953, ofereix el «Fade Club»: 57 € al mes per 3 retocs de degradat, un per setmana, i 1 tall complet. Cada retoc és un servei ràpid de 10 a 15 minuts.","Barberia Macchia, open since 1953, offers the “Fade Club”: €57 a month for 3 fade touch-ups, one a week, and 1 full haircut. Each touch-up is a quick 10 to 15 minute service."]],
        [["EL DISEÑO","EL DISSENY","THE DESIGN"],["Tarjeta apaisada a doble cara en azul grisáceo. Delante: la marca, el precio y los campos para nombre y fechas de inicio y fin. Detrás: los servicios con iconos, qué incluye el mantenimiento del degradado y el reglamento. Cierra con «Grazie per essere parte della nostra famiglia».","Targeta apaïsada a doble cara en blau grisenc. Davant: la marca, el preu i els camps per al nom i les dates d'inici i final. Darrere: els serveis amb icones, què inclou el manteniment del degradat i el reglament. Tanca amb «Grazie per essere parte della nostra famiglia».","A landscape, double-sided card in a gray-blue. Front: the brand, the price and fields for name and start and end dates. Back: the services with icons, what a fade touch-up includes and the rules. It closes with “Grazie per essere parte della nostra famiglia”."]]],
  listH:["REGLAMENTO","REGLAMENT","RULES"],
  items:[["Válido dentro de los 7 días posteriores a la última cita.","Vàlid dins dels 7 dies posteriors a l'última cita.","Valid within 7 days of the last appointment."],
         ["No sustituye un corte completo.","No substitueix un tall complet.","It does not replace a full haircut."],
         ["No se puede usar los sábados ni los festivos.","No es pot fer servir els dissabtes ni els festius.","Not valid on Saturdays or public holidays."],
         ["Los retoques no usados no se acumulan ni se reembolsan.","Els retocs no utilitzats no s'acumulen ni es reemborsen.","Unused touch-ups do not carry over and are not refundable."]]
},

  meta:[[["TIPO","TIPUS","TYPE"],["Tarjeta de visita","Targeta de visita","Business card"]],

        [["COLORES","COLORS","COLORS"],["Amarillo y blanco","Groc i blanc","Yellow and white"]]],
  secs:[[["EL DISEÑO","EL DISSENY","THE DESIGN"],["Tarjeta a doble cara dividida en dos mitades, una amarilla y una blanca. El logotipo PURO DESIGN, en mayúsculas con mucho espaciado, cruza ambas mitades y ocupa todo el ancho de la cara delantera.","Targeta a doble cara dividida en dues meitats, una groga i una blanca. El logotip PURO DESIGN, en majúscules amb molt d'espaiat, travessa les dues meitats i ocupa tot l'ample de la cara davantera.","A double-sided card split into a yellow half and a white half. The PURO DESIGN logo, in spaced capitals, crosses both halves and runs the full width of the front."]],
        [["LA INFORMACIÓN","LA INFORMACIÓ","THE INFORMATION"],["En la cara trasera: teléfono, dirección (Via 4 Novembre 16, Vasto) y un apartado «Orari» para los horarios, con iconos sencillos sobre el fondo amarillo.","A la cara posterior: telèfon, adreça (Via 4 Novembre 16, Vasto) i un apartat «Orari» per als horaris, amb icones senzilles sobre el fons groc.","On the back: phone, address (Via 4 Novembre 16, Vasto) and an “Orari” (opening hours) area, with simple icons on the yellow background."]]],

{ slug:"llaveros-vasto", n:"06", color:"#C7C2B2", card:"vasto_cover", hero:"vasto_cover",
  gal:["vasto_a4"],
  tag:["ERASMUS+ · MERCHANDISING","ERASMUS+ · MERXANDATGE","ERASMUS+ · MERCHANDISE"],
  title:["Llaveros de Vasto","Clauers de Vasto","Vasto keychains"],
  head:["Vasto, por delante y por detrás.","Vasto, per davant i per darrere.","Vasto, front and back."],
  k3d:true,
  short:["Un llavero de recuerdo para llevarme Vasto a casa: la silueta de los Abruzos con la bandera italiana por un lado y los rincones del pueblo por el otro.","Un clauer de record per endur-me Vasto a casa: la silueta de l'Abruzzo amb la bandera italiana per una banda i els racons del poble per l'altra.","A souvenir keychain to take Vasto home with me: the outline of Abruzzo with the Italian flag on one side and corners of the town on the other."],
  meta:[[["TIPO","TIPUS","TYPE"],["Merchandising","Merxandatge","Merchandise"]],
        [["CONTEXTO","CONTEXT","CONTEXT"],["Erasmus+ · TAM Comunicazione","Erasmus+ · TAM Comunicazione","Erasmus+ · TAM Comunicazione"]],
        [["FORMATO","FORMAT","FORMAT"],["Llavero de dos caras","Clauer de dues cares","Two-sided keychain"]]],
  secs:[[["LA HISTORIA","LA HISTÒRIA","THE STORY"],["No podía irme de Italia sin un llavero del pueblo en el que viví un mes. Así que pensé: ¿y si el llavero que me llevo a casa, y el que regalo a los míos, lo diseño yo? Trabajaba en una empresa que imprime, así que se lo propuse. El resultado es el que puedes girar aquí arriba.","No podia marxar d'Itàlia sense un clauer del poble on vaig viure un mes. Així que vaig pensar: i si el clauer que m'enduc a casa, i el que regalo als meus, el dissenyo jo? Treballava en una empresa que fa impressions, així que els ho vaig proposar. El resultat és el que pots girar aquí dalt.","I couldn't leave Italy without a keychain from the town I'd lived in for a month. So I thought: what if I designed the one I'd take home, and give to the people I love, myself? I was working at a company that does printing, so I pitched it to them. The result is the one you can spin up above."]],
        [["EL DISEÑO","EL DISSENY","THE DESIGN"],["El llavero tiene la silueta de la región de los Abruzos. Por delante, la bandera italiana, con Vasto, el pueblo donde vivía, marcado en granate. Por detrás, los rincones del pueblo que visité y que más se me quedaron.","El clauer té la silueta de la regió de l'Abruzzo. Per davant, la bandera italiana, amb Vasto, el poble on vivia, marcat en bordeus. Per darrere, els racons del poble que vaig visitar i que més se'm van quedar.","The keychain has the outline of the Abruzzo region. On the front, the Italian flag, with Vasto, the town where I lived, marked in burgundy. On the back, the spots in town I visited and that stayed with me most."]]],
  listH:["LO QUE HAY DETRÁS","EL QUE HI HA DARRERE","WHAT'S ON THE BACK"],
  items:[["Punta Aderci, un mirador natural a las afueras del pueblo.","Punta Aderci, un mirador natural als afores del poble.","Punta Aderci, a natural lookout on the outskirts of town."],
         ["Palazzo d'Avalos, el antiguo palacio de una familia aristocrática.","Palazzo d'Avalos, l'antic palau d'una família aristocràtica.","Palazzo d'Avalos, the former palace of an aristocratic family."],
         ["Los trabocchi, las antiguas plataformas de pesca de madera sobre el mar.","Els trabocchi, les antigues plataformes de pesca de fusta sobre el mar.","The trabocchi, old wooden fishing platforms over the sea."],
         ["El Monumento alla Bagnante, que la gente de allí llama «La Sirenita».","El Monumento alla Bagnante, que la gent d'allà anomena «La Sirenita».","The Monumento alla Bagnante, which locals call “La Sirenita” (the Little Mermaid)."]]
},
{ slug:"la-siesta-y-parking-heidi", n:"07", color:"#2F9AA6", card:"hosp_cover", hero:"hosp_cover",

  short:["Hoja de información para las habitaciones de un hotel y señalética de aparcamiento: entrada, de pago y reservado.","Full d'informació per a les habitacions d'un hotel i senyalística d'aparcament: entrada, de pagament i reservat.","An information sheet for hotel rooms and parking signage: entrance, paid and reserved."],

        [["PIEZAS","PECES","PIECES"],["Hoja de habitación · 3 señales","Full d'habitació · 3 senyals","Room sheet · 3 signs"]]],
  secs:[[["LA SIESTA","LA SIESTA","LA SIESTA"],["Hoja A4 con la información que un huésped necesita: teléfonos útiles, climatizador, cambio de moneda, minibar, horarios, contraseña del wifi, caja fuerte y desayuno. Lleva un título caligráfico y un marco fino en verde azulado.","Full A4 amb la informació que un hoste necessita: telèfons útils, climatitzador, canvi de moneda, minibar, horaris, contrasenya del wifi, caixa forta i esmorzar. Porta un títol cal·ligràfic i un marc fi en verd blavós.","An A4 sheet with what a guest needs: useful numbers, air conditioning, currency exchange, minibar, hours, wifi password, safe and breakfast. It has a calligraphic title and a thin teal frame."]],
        [["PARKING HEIDI","PARKING HEIDI","HEIDI PARKING"],["Señalética de aparcamiento: un cartel con la «P» y «A pagamento» (de pago) sobre fondo azul, y un indicador vertical de «Ingresso parcheggio» con una flecha hacia la entrada. También hice versiones para aparcamiento completo y plaza reservada.","Senyalística d'aparcament: un cartell amb la «P» i «A pagamento» (de pagament) sobre fons blau, i un indicador vertical d'«Ingresso parcheggio» amb una fletxa cap a l'entrada. També vaig fer versions per a aparcament ple i plaça reservada.","Parking signage: a sign with the “P” and “A pagamento” (paid) on a blue background, and a vertical “Ingresso parcheggio” (parking entrance) indicator with an arrow toward the entrance. I also made versions for a full car park and reserved spaces."]]],
  listH:["","",""], items:[]
}
,{ slug:"disseny-esportiu", n:"08", color:"#1E3A8A", card:"sport_cover", hero:"sport_cover",

  head:["El partido también se juega en el diseño.","El partit també es juga en el disseny.","The match is also played in the design."],
  short:["Nueve carteles y piezas para redes de fútbol y baloncesto: retratos de jugadores, días de partido y temporadas de la Liga, la Premier y la NBA.","Nou cartells i peces per a xarxes de futbol i bàsquet: retrats de jugadors, dies de partit i temporades de la Lliga, la Premier i l'NBA.","Nine posters and social pieces for football and basketball: player portraits, matchdays and seasons from LaLiga, the Premier League and the NBA."],

function initBB(l){
  document.querySelectorAll('.bb').forEach(bb=>{
    const tr=bb.querySelector('.bbtrack'), prev=bb.querySelector('.prev'), next=bb.querySelector('.next'), lab=bb.querySelector('.bbi');
    const idx=()=>Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
    const upd=()=>{const i=idx(); lab.textContent=i+1; prev.disabled=i<=0; next.disabled=i>=BBN-1;};
    const go=(i,inst)=>tr.scrollTo({left:Math.max(0,Math.min(BBN-1,i))*tr.clientWidth,behavior:(inst||reduce)?'auto':'smooth'});
    prev.addEventListener('click',()=>go(idx()-1)); next.addEventListener('click',()=>go(idx()+1));
    tr.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
    tr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(idx()+1);} if(e.key==='ArrowLeft'){e.preventDefault();go(idx()-1);} if(e.key==='Enter'){openBB(l,idx(),i=>go(i,true),bb.querySelector('.bbfs'));}});
    const open=()=>openBB(l,idx(),i=>go(i,true),bb.querySelector('.bbfs'));
    bb.querySelector('.bbfs').addEventListener('click',open);
    tr.addEventListener('click',e=>{ if(e.target.closest('.bbs')) open(); });
    addEventListener('resize',()=>go(idx(),true));
    upd();
  });
}
function openBB(l,i,sync,back){

  document.body.appendChild(o); document.body.classList.add('bbopen');
  const img=o.querySelector('img'), cnt=o.querySelector('.bbon'), pv=o.querySelector('.prev'), nx=o.querySelector('.next');
  const set=k=>{ i=Math.max(0,Math.min(BBN-1,k)); img.src=bbSrc(l,i); img.alt=`${pick(UI.bbL,l)} · ${i+1}/${BBN}`; cnt.textContent=`${i+1} / ${BBN}`; pv.disabled=i<=0; nx.disabled=i>=BBN-1;
    [i-1,i+1].forEach(j=>{ if(j>=0&&j<BBN){ const p=new Image(); p.src=bbSrc(l,j); } }); };
  const close=()=>{ o.classList.add('out'); document.body.classList.remove('bbopen'); removeEventListener('keydown',key,true); sync(i); setTimeout(()=>o.remove(),reduce?0:220); if(back) back.focus({preventScroll:true}); };
  const key=e=>{ if(e.key==='Escape'){e.preventDefault();close();} else if(e.key==='ArrowRight'){e.preventDefault();set(i+1);} else if(e.key==='ArrowLeft'){e.preventDefault();set(i-1);} e.stopPropagation(); };
  pv.addEventListener('click',()=>set(i-1)); nx.addEventListener('click',()=>set(i+1)); o.querySelector('.bbox').addEventListener('click',close);
  o.addEventListener('click',e=>{ if(e.target===o||e.target.classList.contains('bboin')) close(); });

function introMeasure(){
  if(!IN.hero||reduce) return;
  const st=IN.el.querySelector('.istage'), H=IN.hero;
  document.documentElement.style.setProperty('--navh',navH()+'px');
  H.style.transform='none';
  const HB=H.getBoundingClientRect(), SB=st.getBoundingClientRect();
  IN.ox=HB.left-SB.left; IN.oy=HB.top-SB.top; // the hero is not flush with the stage (page margins on wide screens)
  IN.W=st.clientWidth; IN.H=Math.min(st.clientHeight, innerHeight-navH());
  const phone=innerWidth<=640;
  IN.steps.forEach((s,i)=>{
    if(!s.f){ s.cx=null; s.sc=1; return; }
    const r=s.f.getBoundingClientRect(); s.cx=r.left-HB.left+r.width/2; s.cy=r.top-HB.top+r.height/2;
    const fill = i===0||i===5 ? (phone?.8:.62) : (i===4 ? .78 : (phone?.62:.5));
    s.sc=Math.max(1,Math.min((phone?2.2:2.6), fill*IN.W/r.width, .42*IN.H/r.height));
  });
  IN.len=Math.max(260,innerHeight*.55);
  IN.el.style.height=(st.offsetHeight+IN.len*(IN.steps.length-1)+innerHeight*.25)+'px';
  IN.p=-1; introFrame();
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function camOf(s){ return s.cx===null ? {x:0,y:0,s:1} : {s:s.sc, x:IN.W/2-IN.ox-s.cx*s.sc, y:IN.H/2-IN.oy-s.cy*s.sc}; }
function introFrame(){
  if(!IN.hero||reduce||!IN.steps.length) return;
  const top=IN.el.getBoundingClientRect().top+scrollY;
  const p=Math.max(0,Math.min(IN.steps.length-1,(scrollY-top)/IN.len));
  if(Math.abs(p-IN.p)<.0005) return; IN.p=p;
  const k=Math.floor(p), f=p-k, t=ease(Math.min(1,f/.62));
  const A=camOf(IN.steps[k]), B=camOf(IN.steps[Math.min(k+1,IN.steps.length-1)]);
  const last=IN.steps.length-1;
  let s,x,y;
  if(k+1===last){ // pull back: interpolate in log-scale so the zoom-out feels even
    const ls=Math.exp(Math.log(A.s)+(Math.log(B.s)-Math.log(A.s))*t); s=ls;
    const cxA=(IN.W/2-IN.ox-A.x)/A.s, cyA=(IN.H/2-IN.oy-A.y)/A.s, cxB=(IN.W/2-IN.ox-B.x)/B.s, cyB=(IN.H/2-IN.oy-B.y)/B.s;
    const cx=cxA+(cxB-cxA)*t, cy=cyA+(cyB-cyA)*t; x=IN.W/2-IN.ox-cx*s; y=IN.H/2-IN.oy-cy*s;
  } else { s=A.s+(B.s-A.s)*t; x=A.x+(B.x-A.x)*t; y=A.y+(B.y-A.y)*t; }
  IN.hero.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
  IN.steps.forEach((st,i)=>{ const o = i===0 ? 1 : Math.max(0,Math.min(1,(p-(i-1)-.3)/.45));
    st.show.forEach(el=>{ el.style.opacity=o.toFixed(3); el.style.pointerEvents=o>.6?'':'none'; }); });
  const hint=IN.el.querySelector('.ihint'); if(hint) hint.style.opacity=Math.max(0,1-p*2.5).toFixed(3);
  IN.el.classList.toggle('done',p>=last-.001);
  hzPager(p);
}

const HZ={R:[[1,3],[6,8]],busy:0,acc:0,drag:null};   // the 3 leaves of each map

function hzActive(){ return !reduce && !!hzRange(hzCur()); }
function hzGo(d){
  if(HZ.busy>performance.now()) return; const c=hzCur(), rg=hzRange(c); if(!rg) return;
  const n=Math.max(rg[0],Math.min(rg[1],c+d)); if(n===c){ const g=IN.el.querySelector('.ipager'); if(g){ g.classList.remove('edge'); void g.offsetWidth; g.classList.add('edge'); } return; }

}
function hzPager(p){

      const fin=Math.min(1,(t-a)/.35), fo=Math.min(1,(b-t)/.35); op=Math.min(fin,fo);
      if(p.g==='c'){ const bk=eout(seg(t,5.35,6.6)); px=50+p.v[0]*bk*1.05+p.v[0]*.12*(t-5.35); py=50+p.v[1]*bk*1.05+p.v[1]*.12*(t-5.35); sc=lerp(.2,1,bk); op=Math.min(op, bk>0?1:0); }
      else if(p.g==='d'){ px=p.x+p.v[0]*k*4; py=-10+k*58*p.z+ (p.z*8); }
      else { px=p.x+p.v[0]*k*.9; py=p.y+p.v[1]*k*.9; }
      // pointer: things get out of the way
      const ex=px/100*sw+p.ox, ey=py/100*sh+p.oy, dx=ex-mx, dy=ey-my, d2=dx*dx+dy*dy, R=sh*.22;
      if(d2<R*R && d2>1){ const d=Math.sqrt(d2), f=(1-d/R)*2.2; p.vx+=dx/d*f; p.vy+=dy/d*f; }
      p.vx+=-p.ox*.04; p.vy+=-p.oy*.04; p.vx*=.86; p.vy*=.86; p.ox+=p.vx; p.oy+=p.vy;
      p.rot+=p.spin*.016 + p.vx*.4; p.pop*=.9;
      const size=p.s/100*sh*(1+p.pop);
      const bl = p.z>1.3 ? (p.z-1.3)*16 : (p.z<.8 ? (.8-p.z)*10 : 0);
      p.e.style.width=p.e.style.height=size.toFixed(1)+'px';
      p.e.style.opacity=op.toFixed(3); p.e.style.zIndex=p.z>1.05?4:1;
      p.e.style.filter=bl>.4?`blur(${bl.toFixed(1)}px)`:'';
      p.e.style.transform=`translate(${(px/100*sw+p.ox-size/2).toFixed(1)}px,${(py/100*sh+p.oy-size/2).toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg) scale(${(sc*p.z).toFixed(3)})`;
    }
    // ---- player chrome
    fill.style.width=(t/D*100).toFixed(2)+'%'; tm.textContent=`${fmt(t)} / ${fmt(D)}`;
  }
  function loop(now){
    const dt=Math.min(.05,(now-(last||now))/1000); last=now;
    if(playing && !scrub){ t+=dt; if(t>=D) t-=D; }
    if(!drag){ spinV+=(-spinU)*.06; spinV*=.82; spinU+=spinV; if(Math.abs(spinU)<.001 && Math.abs(spinV)<.001){spinU=0;spinV=0;} }
    tilt*=.9;
    frame(t);
    raf = vis ? requestAnimationFrame(loop) : 0;
  }
  const kick=()=>{ if(!raf && vis){ last=0; raf=requestAnimationFrame(loop); } };
  onVisible(root,v=>{ vis=v; if(v) kick(); });
  const setPlay=(p)=>{ playing=p; root.classList.toggle('paused',!p); pl.setAttribute('aria-label',p?L.pause:L.play); };
  setPlay(playing);
  pl.addEventListener('click',e=>{ e.stopPropagation(); setPlay(!playing); });
  big.addEventListener('click',e=>{ e.stopPropagation(); setPlay(true); });
  // scrubbing
  const seek=(e)=>{ const r=bar.getBoundingClientRect(); t=clamp((e.clientX-r.left)/r.width,0,.999)*D; frame(t); };
  bar.addEventListener('pointerdown',e=>{ e.stopPropagation(); scrub=true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove',e=>{ if(scrub) seek(e); });
  bar.addEventListener('pointerup',()=>{ scrub=false; });
  bar.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){t=Math.min(D-.01,t+1);frame(t);} if(e.key==='ArrowLeft'){t=Math.max(0,t-1);frame(t);} });
  // the hidden part: the scene answers the pointer
  st.addEventListener('pointermove',e=>{ const r=st.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top;
    if(drag){ const dx=e.clientX-drag.x; spinU=drag.s+dx/r.width*Math.PI*2.4; spinV=(dx-drag.lx)/r.width*2; drag.lx=dx; drag.moved=Math.abs(dx)>4; }
    else tilt=lerp(tilt,(mx/r.width-.5)*10,.15); kick(); });
  st.addEventListener('pointerleave',()=>{ mx=my=-1e3; });
  st.addEventListener('pointerdown',e=>{ if(e.target.closest('.rxui')) return; const r=cv.getBoundingClientRect();
    const onCan=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
    const hit=ps.find(p=>{ const b=p.e.getBoundingClientRect(); return +p.e.style.opacity>.3 && e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom; });
    if(hit){ hit.pop=.45; hit.vx+=(Math.random()-.5)*40; hit.vy-=18; hit.spin*=-3; kick(); return; }
    if(onCan){ drag={x:e.clientX,s:spinU,lx:0,moved:false}; st.setPointerCapture(e.pointerId); st.classList.add('grab'); }
    else drag={tap:true};
  });
  st.addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null; st.classList.remove('grab');
    if(d.tap){ setPlay(!playing); return; }
    if(!d.moved){ spinV+=.35; } // a tap on the can gives it a little turn
    // released past half a turn: keep going to the next flavor face, then settle back
  });
  st.addEventListener('pointercancel',()=>{ drag=null; st.classList.remove('grab'); });
  // fullscreen: the player floats over a blurred page
  const fs=root.querySelector('.rxfs'); let ph=null;
  const closeFs=()=>{ if(!ph) return; ph.parentNode.insertBefore(root,ph); ph.remove(); ph=null; document.querySelector('.rxov')?.remove(); root.classList.remove('full'); fs.setAttribute('aria-label',L.full); document.documentElement.classList.remove('rxlock'); };
  fs.addEventListener('click',e=>{ e.stopPropagation();
    if(ph) return closeFs();
    ph=document.createComment('rx'); root.parentNode.insertBefore(ph,root);
    const ov=document.createElement('div'); ov.className='rxov'; ov.addEventListener('click',closeFs); document.body.appendChild(ov); document.body.appendChild(root);
    root.classList.add('full'); fs.setAttribute('aria-label',L.exit); document.documentElement.classList.add('rxlock'); });
  addEventListener('keydown',e=>{ if(e.key==='Escape') closeFs(); });
  addEventListener('hashchange',closeFs);
  frame(t);
}

/* ===== 3 · Sports posters: a fan that seems to play by itself ===== */
function initPosters(root){
  const cards=[...root.querySelectorAll('.pfc')], N=cards.length, grp=root.querySelector('.pfg');
  const hxp=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const cols=cards.map(c=>hxp((c.dataset.c||'#1F2624').split('|')[0]));
  const cols2=cards.map(c=>{ const p=(c.dataset.c||'').split('|'); return p[1]?hxp(p[1]):null; });
  if(!document.getElementById('pgx')){ const g=document.createElement('div'); g.id='pgx'; g.setAttribute('aria-hidden','true'); document.body.prepend(g); }
  let cur=0, target=0, auto=!RM, nextAt=performance.now()+2600, vis=false, raf=0, drag=null, hover=0, hx=0, hy=0, spinI=-1, spinT=0;
  const wrap=(r)=>{ r=((r%N)+N)%N; return r>N/2?r-N:r; };
  function frameP(now){
    if(!drag){ cur+= (target-cur)*.12; if(Math.abs(target-cur)<.0005) cur=target; }
    if(auto && !drag && now>nextAt){ target=Math.round(target)+1; nextAt=now+2600; }
    hover+=((root.matches(':hover')?1:0)-hover)*.1;
    const spread=1+.12*hover;
    grp.style.transform=`rotateY(${(hx*8*hover).toFixed(2)}deg) rotateX(${(-hy*6*hover).toFixed(2)}deg)`;
    cards.forEach((c,i)=>{ const r=wrap(i-cur), a=Math.abs(r);
      const x=r*31*spread, sc=1-.17*Math.min(a,1.6), z=-a*140, op=a<1.25?1:clamp(1-(a-1.25)*3,0,1);
      let ry=-r*4; if(i===spinI){ const k=clamp((now-spinT)/750,0,1); ry+=ease(k)*360; if(k>=1) spinI=-1; }
      c.style.transform=`translate(-50%,-50%) translateX(${x.toFixed(2)}cqw) translateZ(${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      c.style.opacity=op.toFixed(3); c.style.zIndex=String(100-Math.round(a*10)); c.style.setProperty('--dim',Math.min(a,1).toFixed(3));
      c.style.visibility=op<=0?'hidden':'visible'; });
    // the page takes the colour of the poster in front (blended while they move)
    { const i0=Math.floor(cur), f=cur-i0, A=cols[((i0%N)+N)%N], B=cols[(((i0+1)%N)+N)%N]; window.__PFC=A.map((v,k)=>Math.round(v+(B[k]-v)*f));
      const ia=((i0%N)+N)%N, ib=(((i0+1)%N)+N)%N, A2=cols2[ia], B2=cols2[ib];   // two-colour posters (e.g. Betis–Girona): left / right of the page
      window.__PFC2 = (A2||B2) ? {c:(f<.5?(A2||B2):(B2||A2)), a:(A2?1-f:0)+(B2?f:0)} : null; }
    raf = vis ? requestAnimationFrame(frameP) : 0;
  }
  onVisible(root,v=>{ vis=v; if(v&&!raf) raf=requestAnimationFrame(frameP); });
  root.addEventListener('pointermove',e=>{ const r=root.getBoundingClientRect(); hx=(e.clientX-r.left)/r.width*2-1; hy=(e.clientY-r.top)/r.height*2-1;
    if(drag){ const dx=e.clientX-drag.x; cur=drag.c - dx/(r.width*.31); target=cur; if(Math.abs(dx)>6) drag.moved=true; } });
  root.addEventListener('pointerdown',e=>{ drag={x:e.clientX,c:cur,moved:false}; root.setPointerCapture(e.pointerId); root.classList.add('grab'); });
  const up=(e)=>{ if(!drag) return; const d=drag; drag=null; root.classList.remove('grab'); nextAt=performance.now()+4200;
    if(d.moved){ target=Math.round(cur); return; }
    const c=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('pfc'));
    if(!c) return; const i=cards.indexOf(c), r=wrap(i-cur);
    if(Math.abs(r)<.5){ spinI=i; spinT=performance.now(); } else target=Math.round(cur)+Math.round(r); };
  root.addEventListener('pointerup',up); root.addEventListener('pointercancel',()=>{drag=null; root.classList.remove('grab');});
  root.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){target=Math.round(target)+1;nextAt=performance.now()+4200;} if(e.key==='ArrowLeft'){target=Math.round(target)-1;nextAt=performance.now()+4200;} });
}

/* ===== wiring ===== */
function initCovers(){
  document.querySelectorAll('[data-cov]:not([data-ready])').forEach(el=>{ el.dataset.ready='1';
    const ty=el.dataset.cov; let L={}; try{ L=JSON.parse(el.dataset.l||'{}'); }catch(_){}
    try{ if(ty==='grada') initGrada(el); else if(ty==='romo') initRomo(el,L); else if(ty==='posters') initPosters(el); }catch(err){ console.error('cover',ty,err); } });
}
let q=0; new MutationObserver(()=>{ if(!q) q=requestAnimationFrame(()=>{ q=0; initCovers(); }); }).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
initCovers();
})();

render();
</script>
